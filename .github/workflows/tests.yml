name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # get your code onto the runner
      - uses: astral-sh/setup-uv@v5        # install uv
        with:
          python-version: "3.14"
      - run: uv sync                       # install dependencies
      - run: uv run pytest                 # run the tests
