[project]
name = "ml-engineering-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
