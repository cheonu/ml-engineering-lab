experiment_name: telco-churn
run_name: rf-balanced-depth12
pos_label: 1
registered_model_name: churn-model

data:
  filepath: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  drop_columns:
    - customerID
  to_numeric: TotalCharges
  target: Churn
  categorical_columns:
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaymentMethod
    - gender
    - Partner
    - Dependents
    - PhoneService
    - PaperlessBilling

  binary_columns:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - PaperlessBilling
    - Churn
  numeric_columns:
    - SeniorCitizen
    - tenure
    - MonthlyCharges
    - TotalCharges
model:
  type: RandomForestClassifier
  params:
    max_depth: 12
    n_estimators: 100
    class_weight: balanced
    random_state: 48
